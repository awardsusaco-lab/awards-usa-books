<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Awards USA Books</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Awards USA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1D3A5E">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F5;--surface:#FFFFFF;--ink:#16202C;--muted:#5A6473;--line:#DADFE6;--chip:#E8EBF0;
  --primary:#1D3A5E;--primary-ink:#FFFFFF;--brass:#9E7B31;--brass-soft:#F3EBDA;
  --good:#2C7649;--bad:#AE3828;--warn:#8E5E00;
  --side:#1D3A5E;--side-ink:#E6ECF4;--side-muted:#9FB2C9;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10141A;--surface:#19202A;--ink:#E6EAF0;--muted:#98A2B0;--line:#2A3340;--chip:#222A35;
    --primary:#7FA6D3;--primary-ink:#0D1622;--brass:#CFAA5E;--brass-soft:#2C2618;
    --good:#62B98A;--bad:#E8806E;--warn:#E3AE4F;
    --side:#0B1017;--side-ink:#DCE4EE;--side-muted:#7F8FA3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141A;--surface:#19202A;--ink:#E6EAF0;--muted:#98A2B0;--line:#2A3340;--chip:#222A35;
  --primary:#7FA6D3;--primary-ink:#0D1622;--brass:#CFAA5E;--brass-soft:#2C2618;
  --good:#62B98A;--bad:#E8806E;--warn:#E3AE4F;
  --side:#0B1017;--side-ink:#DCE4EE;--side-muted:#7F8FA3;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;font-weight:600;line-height:1.1;margin:0}
h1{font-size:30px;letter-spacing:.2px}
h2{font-size:22px}
h3{font-size:18px}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
img{max-width:100%}

#app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 0;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 22px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.brand b{display:block;font-family:'Barlow Condensed',system-ui,sans-serif;font-size:24px;font-weight:700;line-height:1}
.brand span{font-size:13px;color:var(--side-muted)}
.side a{display:block;padding:9px 22px 9px 26px;color:var(--side-ink);text-decoration:none;position:relative;font-weight:500}
.side a:hover{background:rgba(255,255,255,.05)}
.side a[aria-current="page"]{background:rgba(255,255,255,.08)}
.side a[aria-current="page"]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:6px;background:var(--brass);clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 0);border-radius:0 2px 2px 0}
.side .storage{margin:18px 22px 0;font-size:12.5px;color:var(--side-muted)}

main{padding:28px 32px 60px;max-width:1180px;width:100%}
.tabs{display:none}

.pagehead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none;color:inherit;display:inline-block}
a.btn.primary{color:var(--primary-ink)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--primary);cursor:pointer;font-weight:500}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.panel > h2,.panel > h3{margin-bottom:12px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--bad)}

.ledger{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:18px;overflow:hidden}
.ledger div{padding:14px 18px;border-left:1px solid var(--line)}
.ledger div:first-child{border-left:0}
.ledger span{display:block;color:var(--muted);font-size:13px}
.ledger b{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.grid2 > .panel{margin-bottom:0}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:11px 4px;border-top:1px solid var(--line);align-items:center;text-decoration:none;color:inherit;cursor:pointer}
.item:first-child{border-top:0}
.item:hover{background:var(--chip)}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.item .s{color:var(--muted);font-size:13.5px}
.item .r{text-align:right}
.empty{padding:22px 4px;color:var(--muted)}
.empty .btn{margin-top:10px}

.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);vertical-align:1px}
.badge.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.badge.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.brass{background:var(--brass-soft);color:var(--brass)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1;min-width:180px;max-width:320px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px;background:var(--surface)}
.seg a{padding:8px 16px;text-decoration:none;color:var(--ink);font-weight:500;border-left:1px solid var(--line)}
.seg a:first-child{border-left:0}
.seg a[aria-current="page"]{background:var(--primary);color:var(--primary-ink)}

.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13px;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--chip)}
tr.sub td{font-weight:600;border-top:1px solid var(--muted)}
tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:3px double var(--ink)}
tr.group td{font-weight:600;padding-top:16px;border-bottom:0;font-family:'Barlow Condensed',system-ui,sans-serif;font-size:17px}
td.ind{padding-left:26px}

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fields .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea,.lines input,.lines select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
label.f textarea{min-height:70px;resize:vertical}
label.check{display:flex;gap:8px;align-items:center;font-size:14px}
.formfoot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.formfoot .right{display:flex;gap:8px;margin-left:auto}
.err{color:var(--bad);font-size:14px;min-height:1em}

.lines{margin-top:14px;border-top:1px solid var(--line)}
.line{display:grid;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.line.inv{grid-template-columns:1.4fr 1.8fr 70px 100px 100px 34px 32px}
.line.buy{grid-template-columns:1.6fr 1.6fr 70px 100px 100px 32px}
.line.je{grid-template-columns:1.8fr 1.6fr 110px 110px 32px}
.line .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.lines .hdr{display:grid;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600;padding:8px 0 0}
.lines .hdr.inv{grid-template-columns:1.4fr 1.8fr 70px 100px 100px 34px 32px}
.lines .hdr.buy{grid-template-columns:1.6fr 1.6fr 70px 100px 100px 32px}
.lines .hdr.je{grid-template-columns:1.8fr 1.6fr 110px 110px 32px}
.line.tax,.lines .hdr.tax{grid-template-columns:2fr 100px 1.3fr 32px}
.taxcell{display:flex;justify-content:center;align-items:center;gap:6px;font-size:14px}.mlabel{display:none}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:4px}
.x:hover{color:var(--bad)}
.totals{margin-left:auto;width:min(300px,100%);margin-top:12px}
.totals div{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
.totals div.grand{font-weight:700;border-top:1px solid var(--ink);margin-top:4px;padding-top:6px;font-size:17px}

.sheet{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;overflow:auto;z-index:50}
.sheet[hidden]{display:none}
.sheet-card{background:var(--surface);border-radius:14px;width:min(860px,100%);padding:20px 22px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet-card.narrow{width:min(520px,100%)}
.sheet-card > header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
#toast.show{opacity:1}
.notice{background:var(--brass-soft);border:1px solid color-mix(in srgb,var(--brass) 40%,transparent);color:var(--ink);padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:14px}

.doc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px;position:relative;overflow:hidden}
.stamp{position:absolute;top:150px;left:44%;transform:rotate(-14deg);border:4px solid currentColor;border-radius:8px;padding:4px 16px 6px;text-align:center;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:44px;letter-spacing:4px;line-height:1;opacity:.82;pointer-events:none;z-index:2}
.stamp small{display:block;font-size:13px;letter-spacing:.5px;font-weight:600;margin-top:3px}
.stamp.paid{color:#2C7649}.stamp.sent{color:#1D5FA8}
@media (max-width:860px){.stamp{top:auto;bottom:40%;left:auto;right:8%;font-size:32px}}
.doc-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.doc-head .co{display:flex;gap:16px;align-items:center}.doc-head .co .logo{height:92px;width:auto;flex:none}
.doc-head .co b{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:24px}
.doc-head .meta{text-align:right}
.doc-head .meta h2{font-size:28px;color:var(--brass)}
.kv{display:grid;grid-template-columns:auto auto;gap:2px 14px;justify-content:end;font-size:14px}
.kv span{color:var(--muted)}
.pre{white-space:pre-line}

.timeline .note{padding:10px 0;border-top:1px solid var(--line)}
.timeline .note:first-child{border-top:0}
.timeline .note .d{font-size:12.5px;color:var(--muted)}
.contact{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14.5px}
.contact span{color:var(--muted)}
.back{display:inline-block;margin-bottom:10px;text-decoration:none;font-weight:500}
.morelist a{display:flex;justify-content:space-between;padding:14px 4px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:500}
.morelist a:first-child{border-top:0}

@media (max-width:860px){
  #app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:18px 14px calc(84px + env(safe-area-inset-bottom,0px))}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:40}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:600}
  .tabs a svg{width:22px;height:22px}
  .tabs a[aria-current="page"]{color:var(--primary)}
  .ledger{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ledger div:nth-child(3){border-left:0}
  .ledger div:nth-child(n+3){border-top:1px solid var(--line)}
  .grid2{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr}
  h1{font-size:26px}
  .sheet{padding:0;align-items:stretch}
  .sheet-card,.sheet-card.narrow{border-radius:0;min-height:100%;width:100%;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
  .lines .hdr{display:none}
  .line.inv,.line.buy{grid-template-columns:1fr 1fr 1fr}
  .line.inv > :nth-child(1),.line.inv > :nth-child(2),.line.buy > :nth-child(1),.line.buy > :nth-child(2){grid-column:1/-1}
  .line.je{grid-template-columns:1fr 1fr}
  .line.je > :nth-child(1),.line.je > :nth-child(2){grid-column:1/-1}
  .line .amt{text-align:left}
  .mlabel{display:inline}.taxcell{justify-content:flex-start}
  .doc{padding:18px}
  .doc-head .meta{text-align:left}
  .kv{justify-content:start}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.newitem{border:1px dashed var(--brass);border-radius:10px;padding:12px;margin:4px 0 8px;background:var(--brass-soft)}
.newitem .fields{grid-template-columns:2fr 1fr 1fr 1.3fr}
@media (max-width:860px){.newitem .fields{grid-template-columns:1fr 1fr}}
@media print{
  .side,.tabs,.pagehead,.back,.notice,#toast,.sheet,main > p,main > .actions,.noprint,main .chips{display:none!important}
  #app{display:block} main{padding:0;max-width:none} body{background:#fff}
  .doc{border:0;padding:0} :root{--surface:#fff;--ink:#000;--line:#ccc;--muted:#444;--bg:#fff}
}
</style>
</head>
<body>
<div id="app">
  <aside class="side" aria-label="Main navigation">
    <div class="brand"><b id="brandName">Awards USA</b><span>Books, customers &amp; stock</span></div>
    <nav id="sideNav"></nav>
    <div class="storage" id="storageNote"></div>
  </aside>
  <main id="main" tabindex="-1"><p class="muted">Loading your books…</p></main>
  <nav class="tabs" id="tabs" aria-label="Main navigation"></nav>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" id="sheetCard" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header><h2 id="sheetTitle"></h2><button class="btn small" data-act="closeSheet">Close</button></header>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>
<input type="file" id="bankFile" accept=".csv,.ofx,.qfx,.qbo,.txt,text/csv" hidden>

<script>
/* ===== Awards USA Books — Google connection (standalone app) ===== */
const GCONF = {clientId:"716584089626-andmrvj5903n6otjbu41gn1qtronpivn.apps.googleusercontent.com"};
const GSCOPES = ["openid","email","https://www.googleapis.com/auth/drive.appdata","https://www.googleapis.com/auth/gmail.compose","https://www.googleapis.com/auth/gmail.readonly","https://www.googleapis.com/auth/calendar.events"].join(" ");
const IS_IOS_APP = (window.navigator.standalone === true) || (/iPhone|iPad|iPod/.test(navigator.userAgent) && window.matchMedia("(display-mode: standalone)").matches);
const GAuth = {
  tok:null, email:"", listeners:[],
  load(){ try { const t = JSON.parse(localStorage.getItem("aub-token") || "null"); if (t) { this.tok = t; this.email = t.email || ""; } this.email = this.email || localStorage.getItem("aub-email") || ""; } catch(e) {} },
  save(){ try { localStorage.setItem("aub-token", JSON.stringify(this.tok)); if (this.email) localStorage.setItem("aub-email", this.email); } catch(e) {} },
  valid(){ return !!(this.tok && this.tok.access_token && this.tok.exp > Date.now() + 60e3); },
  soon(){ return !this.tok || this.tok.exp < Date.now() + 8 * 60e3; },
  configured(){ return !/^__/.test(GCONF.clientId); },
  changed(){ this.listeners.forEach(f => { try { f(); } catch(e) {} }); },
  async got(access_token, expires_in){ this.tok = {access_token, exp:Date.now() + (+expires_in || 3600) * 1000, email:this.email}; this.save();
    if (!this.email) { try { const r = await fetch("https://openidconnect.googleapis.com/v1/userinfo", {headers:{Authorization:"Bearer " + access_token}}); const j = await r.json(); if (j.email) { this.email = j.email; this.tok.email = j.email; this.save(); } } catch(e) {} }
    this.changed(); },
  fromRedirect(){ const h = location.hash; if (!/access_token=/.test(h)) return;
    const p = new URLSearchParams(h.slice(1)); const st = p.get("state") || "", want = sessionStorage.getItem("aub-state") || localStorage.getItem("aub-state") || "";
    const back = localStorage.getItem("aub-return") || "#/home";
    history.replaceState(null, "", location.pathname + location.search + back);
    if (st && want && st === want) this.got(p.get("access_token"), p.get("expires_in")); },
  redirect(){ const st = Math.random().toString(36).slice(2); try { sessionStorage.setItem("aub-state", st); localStorage.setItem("aub-state", st); localStorage.setItem("aub-return", location.hash || "#/home"); } catch(e) {}
    const q = new URLSearchParams({client_id:GCONF.clientId, redirect_uri:location.origin + location.pathname, response_type:"token", scope:GSCOPES, include_granted_scopes:"true", state:st, prompt:this.email ? "" : "consent"});
    if (this.email) q.set("login_hint", this.email); location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + q; },
  client:null,
  signIn(opts = {}){ if (!this.configured()) { toast("Google sign-in isn't set up yet."); return; }
    if (IS_IOS_APP || !(window.google && google.accounts && google.accounts.oauth2)) return this.redirect();
    if (!this.client) this.client = google.accounts.oauth2.initTokenClient({client_id:GCONF.clientId, scope:GSCOPES, include_granted_scopes:true,
      callback:r => { if (r && r.access_token) this.got(r.access_token, r.expires_in); },
      error_callback:e => { if (!opts.quiet) toast(e && e.type === "popup_failed_to_open" ? "Allow pop-ups for this app, then try again." : "Google sign-in was closed."); }});
    this.client.requestAccessToken({prompt:opts.quiet || this.email ? "" : "consent", login_hint:this.email || undefined}); },
  signOut(){ const t = this.tok && this.tok.access_token; this.tok = null; this.save(); if (t && window.google && google.accounts && google.accounts.oauth2) try { google.accounts.oauth2.revoke(t, () => {}); } catch(e) {} this.changed(); }
};
async function gfetch(url, opts = {}){
  if (!GAuth.valid()) throw {code:"needs_reauth"};
  const r = await fetch(url, {...opts, headers:{...(opts.headers || {}), Authorization:"Bearer " + GAuth.tok.access_token}});
  if (r.status === 401) { GAuth.tok = null; GAuth.save(); GAuth.changed(); throw {code:"needs_reauth"}; }

let DB = null, DL = null, MCP = null, SAMPLE = null, mode = "starting", writeBlocked = false;
const LS_KEY = "awards-usa-books-v1";
function localSaveRaw(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) { toast("This device is out of storage space. Download a backup from Settings."); } }
function localSave(){ localSaveRaw(); GSync.touch(); }
function localLoad(){ try { const j = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (j) { COLS.forEach(c => { if (Array.isArray(j[c])) S[c] = j[c]; }); if (j.company) S.company = {...COMPANY_DEFAULTS, ...j.company}; if (j._del) S._del = j._del; } } catch(e) {} }

let version = 0;
function bump(){ version++; scheduleRender(); }

async function put(col, obj){
  const id = obj.id || uid();
  const body = clone(obj); delete body.id; body.updatedAt = obj._seed ? 1 : Date.now(); delete body._seed;
  const i = S[col].findIndex(x => x.id === id);
  const local = {id, ...body};
  if (i >= 0) S[col][i] = local; else S[col].push(local);
  bump();
  if (DB) {
    try { await DB.collection(col).doc(id).set(body); }
    catch(e) { handleDbError(e); throw e; }
  } else localSave();
  return id;
}
async function remove(col, id){
  S[col] = S[col].filter(x => x.id !== id); (S._del = S._del || {})[col + "/" + id] = Date.now(); bump();
  if (DB) { try { await DB.collection(col).doc(id).delete(); } catch(e) { handleDbError(e); throw e; } }
  else localSave();
}
async function saveCompany(patch){
  S.company = {...S.company, ...patch, updatedAt:Date.now()}; bump();
  if (DB) { try { await DB.doc("settings/company").set(clone(S.company)); } catch(e) { handleDbError(e); throw e; } }
  else localSave();
}
function handleDbError(e){
  const code = e && e.code;
  if (code === "quota_exceeded") toast("Storage is full. Download a backup, then delete old records.");
  else if (code === "invalid_argument") { writeBlocked = true; toast("You can view these books but not change them."); }
  else toast("Couldn't save. Check your connection and try again.");
}

async function seedIfEmpty(){
  const ts = Date.now();
  if (DB) {
    for (const [id, number, name, type] of DEFAULT_ACCOUNTS) await DB.collection("accounts").doc(id).set({number, name, type, openBal:0, updatedAt:ts});
    await DB.doc("meta/setup").set({done:true, at:ts});
  } else {
    S.accounts = DEFAULT_ACCOUNTS.map(([id, number, name, type]) => ({id, number, name, type, openBal:0}));
    localSave(); bump();
  }
}

let migrated = false;
async function migrate(){
  if (migrated || !S.accounts.length) return; migrated = true;
  try {
    if (!byId("accounts", "a1300")) await put("accounts", {_seed:true, id:"a1300", number:"1300", name:"Brokerage Investment Account", type:"ocasset", openBal:0});
    if (!byId("accounts", "a8000")) await put("accounts", {_seed:true, id:"a8000", number:"8000", name:"Unrealized Investment Gain/Loss", type:"oexpense", openBal:0});
    else if (byId("accounts", "a8000").name === "Unrealized Investment Losses") await put("accounts", {_seed:true, ...clone(byId("accounts", "a8000")), name:"Unrealized Investment Gain/Loss"});
    if (!byId("accounts", "a7100")) await put("accounts", {_seed:true, id:"a7100", number:"7100", name:"Dividends & Interest (Investments)", type:"oincome", openBal:0});
    if (!byId("accounts", "a7200")) await put("accounts", {_seed:true, id:"a7200", number:"7200", name:"Realized Investment Gain/Loss", type:"oincome", openBal:0});
    if (!byId("accounts", "a6060")) await put("accounts", {_seed:true, id:"a6060", number:"6060", name:"Contract Labor", type:"expense", openBal:0});
    if (!byId("accounts", "a2110")) await put("accounts", {_seed:true, id:"a2110", number:"2110", name:"Sales Tax Payable – City of Lakewood", type:"ocliab", openBal:0});
    const t = byId("accounts", "a2100"); if (t && t.name === "Sales Tax Payable") await put("accounts", {_seed:true, ...clone(t), name:"Sales Tax Payable – Colorado DOR"});
  } catch(e) {}
}
async function start(){
  const hasClaude = window.claude && typeof window.claude.use === "function";
  try { DB = hasClaude ? await window.claude.use("db") : null; } catch(e) { DB = null; }
  try { DL = hasClaude ? await window.claude.use("downloads") : null; } catch(e) { DL = null; }
  if (hasClaude) { window.claude.use("mcp").then(m => { MCP = m; bump(); }).catch(() => {}); window.claude.use("sample").then(x => { SAMPLE = x; bump(); }).catch(() => {}); }
  if (DB) {
    mode = "cloud";
    let seeded = false;
    COLS.forEach(col => {
      DB.collection(col).onSnapshot(snap => {
        S[col] = snap.docs.map(d => ({id:d.id, ...clone(d.data())}));
        bump();
        if (col === "accounts" && !snap.metadata.fromCache && !snap.empty) migrate();
        if (col === "accounts" && !snap.metadata.fromCache && snap.empty && !seeded) {
          seeded = true;
          DB.doc("meta/setup").get().then(m => { if (!m.exists) seedIfEmpty().catch(handleDbError); });
        }
      }, err => { if (err.code === "revoked") { mode = "revoked"; bump(); } });
    });
    DB.doc("settings/company").onSnapshot(snap => {
      if (snap.exists) { S.company = {...COMPANY_DEFAULTS, ...clone(snap.data())}; bump(); }
    });
  } else {
    mode = "local";
    localLoad();
    if (GAuth.valid()) { try { await GSync.run(); } catch(e) {} }
    if (!S.accounts.length) await seedIfEmpty(); else await migrate();
  }
  bump();
}

/* ---------- accounting ---------- */
const termDays = t => TERMS[t] ?? 30;
function invTotals(inv){
  let sub = 0, taxable = 0;
  for (const l of inv.lines || []) { const a = r2((+l.qty||0) * (+l.rate||0)); sub += a; if (l.taxable) taxable += a; }
  const tax = r2(taxable * (+inv.taxRate || 0) / 100);
  return {sub:r2(sub), tax, total:r2(sub + tax)};
}
const sumApplied = (list, key, id, skipId) => r2(list.reduce((s, p) => p.id === skipId ? s : s + (p.applied || []).filter(a => a[key] === id).reduce((t, a) => t + (+a.amount || 0), 0), 0));
function taxSplit(inv, tax){
  const parts = (inv.taxParts || []).filter(p => +p.rate > 0), tot = partsRate(parts);
  if (!tax) return [];
  if (!parts.length || Math.abs(tot - (+inv.taxRate || 0)) > 0.0005) return [{name:"Sales tax", rate:+inv.taxRate || 0, agency:"dor", amt:tax}];
  let left = tax;
  return parts.map((p, i) => { const amt = i === parts.length - 1 ? r2(left) : r2(tax * p.rate / tot); left = r2(left - amt); return {name:p.name, rate:+p.rate, agency:p.agency, amt}; });
}
const invPaid = (id, skip) => sumApplied(S.payments, "invoiceId", id, skip);
const invBalance = (inv, skip) => r2(invTotals(inv).total - invPaid(inv.id, skip));
function invStatus(inv){ const b = invBalance(inv); if (b <= 0.004) return "paid"; if (inv.due && inv.due < todayISO()) return "overdue"; return "open"; }
const linesTotal = lines => r2((lines || []).reduce((s, l) => s + r2((+l.qty||0) * (+l.rate||0)), 0));
const billPaid = (id, skip) => sumApplied(S.billpays, "billId", id, skip);
const billBalance = (b, skip) => r2(linesTotal(b.lines) - billPaid(b.id, skip));
const acctName = id => { const a = byId("accounts", id); return a ? (a.number ? a.number + " · " : "") + a.name : "(deleted account)"; };
const custName = id => byId("customers", id)?.name || "(no customer)";
const vendName = id => byId("vendors", id)?.name || "";

function buyPost(l){
  const amt = r2((+l.qty||0) * (+l.rate||0));
  const ref = l.ref || "";
  if (ref.startsWith("i:")) { const it = byId("items", ref.slice(2)); return [it && it.type === "inventory" ? SYS.INV : (it?.expenseAcct || SYS.COGS), amt]; }
  return [ref.slice(2) || SYS.MISC, amt];
}

let J_cache = null, J_ver = -1;
function journal(){
  if (J_ver === version) return J_cache;
  const J = [];
  const add = (date, acct, amt, src, srcId, name, memo) => { amt = r2(amt); if (acct && amt) J.push({date, acct, amt, src, srcId, name:name || "", memo:memo || ""}); };
  for (const a of S.accounts) if (+a.openBal) {
    const sign = DEBIT_NORMAL.has(a.type) ? 1 : -1, d = a.openDate || "2000-01-01";
    add(d, a.id, sign * a.openBal, "Opening balance", a.id); add(d, SYS.OBE, -sign * a.openBal, "Opening balance", a.id, "", a.name);
  }
  for (const it of S.items) if (it.type === "inventory" && +it.openQty && +it.cost) {
    const v = it.openQty * it.cost, d = it.openDate || "2000-01-01";
    add(d, SYS.INV, v, "Opening stock", it.id, "", it.name); add(d, SYS.OBE, -v, "Opening stock", it.id, "", it.name);
  }
  for (const inv of S.invoices) {
    const t = invTotals(inv), nm = custName(inv.customerId), src = "Invoice #" + inv.num;
    add(inv.date, SYS.AR, t.total, src, inv.id, nm);
    for (const l of inv.lines || []) {
      const it = byId("items", l.itemId), amt = r2((+l.qty||0) * (+l.rate||0));
      add(inv.date, it?.incomeAcct || l.acct || SYS.SALES, -amt, src, inv.id, nm, l.desc);
      if (it && it.type === "inventory" && +it.cost) { const c = (+l.qty||0) * it.cost; add(inv.date, SYS.COGS, c, src, inv.id, nm, it.name); add(inv.date, SYS.INV, -c, src, inv.id, nm, it.name); }
    }
    for (const part of taxSplit(inv, t.tax)) add(inv.date, TAX_AGENCIES[part.agency]?.acct || SYS.TAX, -part.amt, src, inv.id, nm, "Sales tax – " + part.name);
  }
  for (const p of S.payments) { const nm = custName(p.customerId), amt = r2((p.applied||[]).reduce((s,a)=>s+(+a.amount||0),0)); add(p.date, p.depositTo || SYS.CHK, amt, "Payment", p.id, nm, p.ref); add(p.date, SYS.AR, -amt, "Payment", p.id, nm, p.ref); }
  for (const b of S.bills) { const nm = vendName(b.vendorId), src = "Bill" + (b.ref ? " " + b.ref : ""); let tot = 0; for (const l of b.lines || []) { const [a, amt] = buyPost(l); tot += amt; add(b.date, a, amt, src, b.id, nm, l.memo); } add(b.date, SYS.AP, -tot, src, b.id, nm); }
  for (const bp of S.billpays) { const nm = vendName(bp.vendorId), amt = r2((bp.applied||[]).reduce((s,a)=>s+(+a.amount||0),0)); add(bp.date, SYS.AP, amt, "Bill payment", bp.id, nm, bp.ref); add(bp.date, bp.fromAcct || SYS.CHK, -amt, "Bill payment", bp.id, nm, bp.ref); }
  for (const e of S.expenses) { const nm = e.vendorId ? vendName(e.vendorId) : (e.payee || ""); let tot = 0; for (const l of e.lines || []) { const [a, amt] = buyPost(l); tot += amt; add(e.date, a, amt, byId("accounts", e.fromAcct)?.type === "ccard" ? "Card charge" : "Check", e.id, nm, l.memo); } add(e.date, e.fromAcct || SYS.CHK, -tot, byId("accounts", e.fromAcct)?.type === "ccard" ? "Card charge" : "Check", e.id, nm, e.ref); }
  for (const j of S.journals) for (const l of j.lines || []) add(j.date, l.acct, (+l.debit||0) - (+l.credit||0), "Journal entry", j.id, "", l.memo || j.memo);
  for (const pr of S.payruns) { const src = "Payroll", nm = pr.employee || "";
    const er = r2((+pr.ssER||0) + (+pr.medER||0) + (+pr.futa||0) + (+pr.coUI||0) + (+pr.famliER||0));
    const wh = r2((+pr.fedWH||0) + (+pr.coWH||0) + (+pr.ssEE||0) + (+pr.medEE||0) + (+pr.famliEE||0));
    add(pr.date, "a6010", +pr.gross || 0, src, pr.id, nm, "Gross wages"); add(pr.date, "a6020", er, src, pr.id, nm, "Employer payroll taxes");
    add(pr.date, "a2300", -(wh + er), src, pr.id, nm, "Withheld + employer taxes owed"); add(pr.date, pr.fromAcct || SYS.CHK, -r2((+pr.gross||0) - wh), src, pr.id, nm, "Net pay"); }
  for (const ad of S.adjustments) { const it = byId("items", ad.itemId); if (!it || !+it.cost) continue; const v = (+ad.qty||0) * it.cost; add(ad.date, SYS.INV, v, "Stock adjustment", ad.id, "", it.name); add(ad.date, SYS.COGS, -v, "Stock adjustment", ad.id, "", it.name); }
  J.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  J_cache = J; J_ver = version; return J;
}
function balances(from, to){
  const m = {};
  for (const l of journal()) { if ((from && l.date < from) || (to && l.date > to)) continue; m[l.acct] = (m[l.acct] || 0) + l.amt; }
  return m;
}
const shown = (acct, raw) => DEBIT_NORMAL.has(acct?.type) ? r2(raw || 0) : r2(-(raw || 0));
function onHand(it){
  if (it.type !== "inventory") return null;
  let q = +it.openQty || 0;
  const ref = "i:" + it.id;
  for (const b of S.bills) for (const l of b.lines || []) if (l.ref === ref) q += +l.qty || 0;
  for (const e of S.expenses) for (const l of e.lines || []) if (l.ref === ref) q += +l.qty || 0;
  for (const inv of S.invoices) for (const l of inv.lines || []) if (l.itemId === it.id) q -= +l.qty || 0;
  for (const ad of S.adjustments) if (ad.itemId === it.id) q += +ad.qty || 0;
  return Math.round(q * 1000) / 1000;
}
const isLow = it => it.type === "inventory" && it.reorder !== "" && it.reorder != null && onHand(it) <= +it.reorder;

async function checkShippingEmail(){
  if (!MCP) return; UI.shipBusy = true; render(); let upd = 0;
  try { for (const o of S.pos.filter(x => (x.status === "placed" || x.status === "shipped") && x.orderNo)) {
      const r = await MCP.callTool("Gmail", "search_threads", {query:`"${String(o.orderNo).replace(/"/g, "")}" newer_than:90d`, pageSize:10});
      const txt = ((r.payload && r.payload.threads) || []).flatMap(t => t.messages || []).map(m => (m.subject || "") + " " + (m.snippet || "")).join(" \n ");
      if (!txt) continue; const patch = {};
      const trk = (txt.match(/\b1Z[0-9A-Z]{16}\b/i) || txt.match(/\b9\d{19,21}\b/) || [])[0];
      if (trk && !o.tracking) patch.tracking = trk;
      if (/\bdelivered\b/i.test(txt)) { patch.deliveredHint = true; if (o.status === "placed") patch.status = "shipped"; }
      else if (o.status === "placed" && /\b(shipped|has shipped|on (its|the) way|shipping confirmation|out for delivery|tracking)\b/i.test(txt)) patch.status = "shipped";
      if (Object.keys(patch).length) { await put("pos", {...clone(byId("pos", o.id)), ...patch}); upd++; } }
    toast(upd ? upd + " order" + (upd === 1 ? "" : "s") + " updated from email" : "No new shipping emails found. Orders need their order number to be matched.");
  } catch(e) { toast(mcpErrText(e)); }
  UI.shipBusy = false; render(); }

  editPO(el){ poForm(clone(byId("pos", el.dataset.id))); },
  async poShipped(el){ const o = byId("pos", el.dataset.id); await put("pos", {...clone(o), status:"shipped", shippedAt:todayISO()}); toast("Marked shipped. Add a tracking number by tapping the order."); },
  poReceive(el){ poReceiveForm(byId("pos", el.dataset.id)); },
  poUnreceive(el){ const o = byId("pos", el.dataset.id); confirmBox("Undo receiving this order? The items come back off your inventory and the purchase record is removed.", "Undo receive", async () => {
    if (o.link && o.link.col) { const paid = o.link.col === "bills" ? billPaid(o.link.id) : 0; if (paid > 0) { toast("That bill has payments. Delete the payment first."); return; } await remove(o.link.col, o.link.id); }
    await put("pos", {...clone(o), status:"shipped", receivedAt:"", received:null, link:null}); toast("Moved back to on the way"); }); },
  delPO(el){ confirmBox("Delete this order?", "Delete", async () => { await remove("pos", el.dataset.id); toast("Deleted"); }); },
  checkShipping(){ checkShippingEmail(); },
  reorderItem(el){ const it = byId("items", el.dataset.id); if (!it) return; const need = it.reorder !== "" && it.reorder != null ? Math.max(1, (+it.reorder * 2) - Math.max(0, onHand(it))) : 1;
    poForm({date:todayISO(), status:"placed", payFrom:"a2200", vendorId:it.vendorId || "", lines:[{ref:"i:" + it.id, qty:need, rate:it.cost || "", memo:it.name}]}); },
  async markSent(el){ const i = byId("invoices", el.dataset.id); await put("invoices", {...clone(i), sentAt:new Date().toISOString()}); toast("Marked as sent"); },
  zipInvoices(){ const list = (UI.lastInvRows || []).map(id => byId("invoices", id)).filter(Boolean); if (!list.length) { toast("No invoices shown to save."); return; }
    toast("Building " + list.length + " PDFs…");
    setTimeout(() => { const seen = new Set(); const files = list.map(i => { let n = pdfName(i); while (seen.has(n)) n = n.replace(/\.pdf$/, "-2.pdf"); seen.add(n); return {name:n, data:docPDF(i)}; });
      const tag = [UI.filter.invy && UI.filter.invy !== "all" ? UI.filter.invy : "", ({open:"unpaid", overdue:"overdue", paid:"paid", all:"all"})[UI.filter.inv || "open"]].filter(Boolean).join("-");
      saveFile("Awards-USA-invoices-" + tag + "-" + todayISO() + ".zip", makeZip(files)); }, 30); },
  askReview(el){ reviewForm(byId("invoices", el.dataset.id)); },
  emailInvoice(el){ const inv = byId("invoices", el.dataset.id), c = byId("customers", inv.customerId) || {};
    const bal = invBalance(inv), t = invTotals(inv);
    openSheet("Email invoice #" + inv.num, `<form data-form="sendInvoice" data-id="${inv.id}"><div class="fields">
    <label class="f full">To<input name="to" type="email" required value="${esc(c.email || "")}"></label>
    <label class="f full">Subject<input name="subject" value="${esc("Invoice #" + inv.num + " from " + S.company.name)}"></label>
    <label class="f full">Message<textarea name="body" style="min-height:160px">${esc(`Hi ${firstName(c)},

Attached is invoice #${inv.num} for ${money(t.total)}${bal < t.total - 0.004 ? ` (balance due ${money(bal)})` : ""}, due ${fmtDate(inv.due)}.

Thank you for your business!

Parker
${S.company.name}${S.company.phone ? "\n" + S.company.phone : ""}`)}</textarea></label>
    <label class="check full"><input type="checkbox" name="askReview" data-act-change="reviewToggle"> Also ask them to leave a Google review</label>
    ${S.company.reviewLink ? "" : `<label class="f full" data-rl hidden>Your Google review link<input name="reviewLink" type="text" inputmode="url" autocapitalize="off" placeholder="https://g.page/r/..."></label>`}
    </div>${MCP ? `<p class="small muted">The invoice is attached as a PDF.</p>${foot(null, "Send")}` : `<p class="small muted">This window can't send through Gmail by itself, so the next step saves the invoice PDF and opens this message in Gmail, ready to go. You just attach the PDF and press Send.</p>${foot(null, "Save PDF & open email")}`}</form>`, true); },
  taxPay(el){ const x = taxDeadlines().find(d => d.key === el.dataset.key); if (!x) return;
    const owedNow = x.payAcct === "a2100" || x.payAcct === "a2110" ? shown(byId("accounts", x.payAcct), balances(null, todayISO())[x.payAcct]) : 0;
    const amt = x.amount || owedNow || 0;
    expenseForm({date:todayISO(), fromAcct:SYS.CHK, vendorId:x.vendor && byId("vendors", x.vendor) ? x.vendor : "", payee:x.vendor && byId("vendors", x.vendor) ? "" : (x.payee || ""), ref:"", lines:[{ref:"a:" + x.payAcct, qty:1, rate:amt ? r2(amt) : "", memo:x.title + " · " + x.period.label}]}, x.key); },
  async taxFiled(el){ await put("taxfilings", {id:el.dataset.key, filedAt:new Date().toISOString(), amount:0}); toast("Marked filed"); },
  async taxUnfile(el){ await remove("taxfilings", el.dataset.key); toast("Moved back to upcoming"); },
  newPayrun(){ payrunForm(); }, editPayrun(el){ payrunForm(clone(byId("payruns", el.dataset.id))); },
  delPayrun(el){ confirmBox("Delete this paycheck?", "Delete paycheck", async () => { await remove("payruns", el.dataset.id); toast("Deleted"); }); },
  payPayroll(){ const owed = shown(byId("accounts", "a2300") || {type:"ocliab"}, balances(null, todayISO()).a2300); expenseForm({date:todayISO(), fromAcct:SYS.CHK, payee:"EFTPS / Colorado DOR", lines:[{ref:"a:a2300", qty:1, rate:owed > 0 ? r2(owed) : "", memo:"Payroll tax deposit"}]}); },
  bankImport(){ $("#bankFile").click(); },
  async txMatch(el){ const t = byId("banktx", el.dataset.id); await put("banktx", {...clone(t), status:"matched", link:{src:el.dataset.src, srcId:el.dataset.srcid}, reviewedAt:Date.now()}); toast("Matched"); },
  async txPayInv(el){ const t = byId("banktx", el.dataset.id), inv = byId("invoices", el.dataset.inv);
    const pid = await put("payments", {customerId:inv.customerId, date:t.date, method:"ACH / bank transfer", ref:"", depositTo:t.acct, applied:[{invoiceId:inv.id, amount:t.amount}]});
    await put("banktx", {...clone(t), status:"added", link:{src:"Payment", srcId:pid, created:true, col:"payments"}, reviewedAt:Date.now()}); toast("Payment recorded on #" + inv.num); },
  async txQuick(el){ const t = byId("banktx", el.dataset.id); await txCreate(t, el.dataset.acct, el.dataset.vendor, t.desc); toast("Added"); },
  txCategorize(el){ txCategorizeForm(byId("banktx", el.dataset.id)); },
  async txExclude(el){ const t = byId("banktx", el.dataset.id); await put("banktx", {...clone(t), status:"excluded", link:null, reviewedAt:Date.now()}); toast("Excluded"); },
  async txUndo(el){ const t = byId("banktx", el.dataset.id);
    if (t.link && t.link.created && t.link.col) await remove(t.link.col, t.link.srcId);
    await put("banktx", {...clone(t), status:"new", link:null}); toast("Moved back to review"); },
  delRule(el){ confirmBox("Delete this rule?", "Delete rule", async () => { await remove("bankrules", el.dataset.id); }); },
  downloadInvoice(el){ const inv = byId("invoices", el.dataset.id); const css = document.querySelector("style").textContent;
    void css; const html = standaloneDoc("Invoice " + inv.num, invoiceDoc(inv, true));
    saveFile(("Invoice-" + inv.num + "-" + custName(inv.customerId)).replace(/[^\w-]+/g, "-") + ".html", html); },
  backup(){ const data = {app:"awards-usa-books", version:1, exported:new Date().toISOString(), company:S.company}; COLS.forEach(c => data[c] = S[c]); saveFile("awards-usa-books-backup-" + todayISO() + ".json", JSON.stringify(data, null, 1)); },
  restore(){ $("#restoreFile").click(); },
  openSource(el){ const src = el.dataset.src, id = el.dataset.id;
    if (src.startsWith("Invoice")) go("invoice/" + id); else if (src === "Payment") paymentForm(clone(byId("payments", id))); else if (src.startsWith("Bill payment")) billpayView(byId("billpays", id));
    else if (src.startsWith("Bill")) billForm(clone(byId("bills", id))); else if (src === "Check" || src === "Card charge") expenseForm(clone(byId("expenses", id))); else if (src === "Journal entry") journalForm(clone(byId("journals", id)));
    else if (src === "Opening stock" || src === "Stock adjustment") { const it = byId("items", id) || byId("items", byId("adjustments", id)?.itemId); if (it) itemForm(clone(it)); } else if (src === "Opening balance") accountForm(clone(byId("accounts", id))); }
};
document.addEventListener("click", e => {
  const ms = e.target.closest("[data-manual-sent]"); if (ms) { const inv = byId("invoices", ms.dataset.manualSent); if (inv && !inv.emailedAt) setTimeout(() => put("invoices", {...clone(inv), emailedAt:new Date().toISOString(), emailedTo:ms.dataset.to, ...(ms.dataset.ask ? {reviewAskedAt:new Date().toISOString()} : {})}), 300); return; }
  const rt = e.target.closest("[data-review-text]"); if (rt) { const inv = byId("invoices", rt.dataset.reviewText); if (inv) setTimeout(() => { put("invoices", {...clone(inv), reviewAskedAt:new Date().toISOString()}); closeSheet(); }, 400); return; }
  const a = e.target.closest("[data-act]");
  if (a && ACT[a.dataset.act] && !(a.tagName === "INPUT" && a.type === "checkbox")) { e.preventDefault(); e.stopPropagation(); ACT[a.dataset.act](a); return; }
  const row = e.target.closest("tr[data-href]"); if (row) { location.hash = row.dataset.href; }
  if (e.target === $("#sheet")) closeSheet();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); if (e.key === "Enter" && e.target.matches("tr[data-href]")) location.hash = e.target.dataset.href; });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.q) { UI.q[t.dataset.q] = t.value; render(); return; }
  const of = t.closest && t.closest("form[data-form=outreach]");
  if (of) { clearTimeout(UI.outTimer); UI.outTimer = setTimeout(() => { const c = byId("customers", of.dataset.id); if (c && document.contains(of)) put("customers", {...clone(c), outreach:{...clone(c.outreach), subject:of.elements.subject.value, body:of.elements.body.value}}); }, 1200); return; }
  const cf = t.closest && t.closest("form[data-form=campaign]");
  if (cf) { clearTimeout(UI.campTimer); UI.campTimer = setTimeout(() => { const c = byId("campaigns", cf.dataset.id); if (c && document.contains(cf)) put("campaigns", {...clone(c), subject:cf.elements.subject.value, body:cf.elements.body.value}); }, 1200); return; }
  if (t.dataset.range) { if (t.value) { UI.range[t.dataset.range] = t.value; render(); } return; }
  if (t.closest("#applyList")) payTotal();
  if (t.dataset.pay !== undefined || (t.closest && t.closest("form[data-form=payrun]"))) { const pf = t.closest("form[data-form=payrun]"); if (pf) { if (!["gross","employee","date"].includes(t.name)) t.dataset.touched = "1"; calcPay(pf); } }
  const f = t.closest("form"); if (f && (t.closest(".lines") || t.name === "taxRate")) recalc(f);
});
document.addEventListener("change", async e => {
  const t0 = e.target, ac = t0.dataset.actChange;
  if (ac === "campBalance" || ac === "campToggle") { const c = byId("campaigns", t0.dataset.id); if (!c) return;
    if (ac === "campBalance") await put("campaigns", {...clone(c), filter:{...clone(c.filter || {}), balance:t0.checked}});
    else { const ex = new Set(c.exclude || []); t0.checked ? ex.delete(t0.dataset.cust) : ex.add(t0.dataset.cust); await put("campaigns", {...clone(c), exclude:[...ex]}); }
    return; }
  const t = e.target, f = t.closest("form");
  if (t.dataset.actChange === "custSort") { UI.filter.csort = t.value; render(); return; }
  if (t.dataset.actChange === "invYear") { UI.filter.invy = t.value; render(); return; }
  if (!f) return;
  const act = t.dataset.actChange;
  if (act === "poVendor" && t.value === "__newvend") { t.value = ""; closeSheet(); vendorForm(); toast("Add the supplier, then log the order again."); return; }
  if (act === "poVendor") { const v = byId("vendors", t.value); if (v && v.defaultAcct) $$(".line.buy [name=ref]", f).forEach(sel => { if (!sel.value) sel.value = "a:" + v.defaultAcct; }); return; }
  if (act === "reviewToggle") { const ta = f.elements.body, rl = f.querySelector("[data-rl]"), link = S.company.reviewLink || (f.elements.reviewLink && f.elements.reviewLink.value) || "";
    if (rl) rl.hidden = !t.checked;
    const blk = reviewBlock(link), i = ta.value.indexOf("If you were happy with your order, would you mind");
    if (t.checked && i < 0) { const sig = ta.value.lastIndexOf("\n\nParker"); ta.value = sig >= 0 ? ta.value.slice(0, sig) + blk + ta.value.slice(sig) : ta.value + blk; }
    if (!t.checked && i >= 0) { const start = ta.value.lastIndexOf("\n\n", i), end = ta.value.indexOf("\n", ta.value.indexOf("\n", i) + 1); ta.value = ta.value.slice(0, start) + (end >= 0 ? ta.value.slice(end) : ""); }
    return; }
  if (t.name === "itemId" && t.value === "__new") { openInlineItem(t.closest(".line")); t.value = ""; return; }
  if (t.name === "itemId" && t.closest(".line.inv")) { const it = byId("items", t.value), row = t.closest(".line"); if (it) { const lp = f.elements.customerId && f.elements.customerId.value ? lastPrice(f.elements.customerId.value, it.id) : null; row.querySelector("[name=desc]").value = it.desc || it.name; row.querySelector("[name=rate]").value = lp ? lp.rate : (it.price || ""); if (lp && lp.rate !== +it.price) toast(`Using ${custName(f.elements.customerId.value)}’s last price: ${money(lp.rate)} (list ${money(it.price)})`); row.querySelector("[name=taxable]").checked = it.taxable !== false && +(f.elements.taxRate?.value || 0) > 0; } recalc(f); }
  if (t.name === "ref" && t.closest(".line.buy") && t.value.startsWith("i:")) { const it = byId("items", t.value.slice(2)), row = t.closest(".line"); if (it && !row.querySelector("[name=rate]").value) row.querySelector("[name=rate]").value = it.cost || ""; if (it && !row.querySelector("[name=memo]").value) row.querySelector("[name=memo]").value = it.name; recalc(f); }
  if (act === "itemType") toggleItemType();
  if (act === "invTerms" && f.elements.due) { f.elements.due.value = addDays(f.elements.date.value || todayISO(), termDays(f.elements.terms.value)); }
  if (act === "custSort") { UI.filter.csort = t.value; render(); return; }
  if (act === "invYear") { UI.filter.invy = t.value; render(); return; }
  if (act === "invCustomer" && t.value === "__newcust") { t.value = ""; openInlineCustomer(f); return; }
  if (act === "invCustomer") { renderPriceRef(f); const c = byId("customers", t.value); if (c) { f.elements.terms.value = c.terms || "Net 30"; f.elements.due.value = addDays(f.elements.date.value, termDays(f.elements.terms.value)); f.elements.taxRate.value = custTax(c); recalc(f); } }
  if (act === "payCustomer") fillApply(null);
  if (act === "applyCheck") { const inp = t.closest("tr").querySelector("input[type=number]"); inp.value = t.checked ? r2(+t.dataset.open) : ""; payTotal(); }
});
$("#bankFile").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try { const parsed = parseStatement(await file.text()); if (!parsed.tx.length) { toast("No transactions found in that file."); return; } stageImport(parsed, UI.bankAcct || SYS.CHK); }
  catch(err) { toast(err.message || "Couldn't read that file."); }
});
$("#restoreFile").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  let data; try { data = JSON.parse(await file.text()); } catch(err) { toast("That file isn't a valid backup."); return; }
  if (data.app !== "awards-usa-books") { toast("That file isn't a backup from this app."); return; }
  const count = COLS.reduce((s, c) => s + (Array.isArray(data[c]) ? data[c].length : 0), 0);
  confirmBox(`Restore ${count} records from ${fmtDate((data.exported || "").slice(0, 10))}? Records with the same ID will be replaced; others are kept.`, "Restore backup", async () => {
    toast("Restoring…"); let n = 0;
    try { for (const c of COLS) for (const rec of (data[c] || [])) { await put(c, rec); n++; } if (data.company) await saveCompany(data.company); toast("Restored " + n + " records"); }
    catch(err) { toast("Restore stopped after " + n + " records."); }
  });
});

render();
start();
</script>
</body>
</html>
